[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-novel-system"
version = "1.0.0"
description = "AI 小说创作系统 — 十日终焉级创作引导与质量保障平台"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.25",
    "chromadb>=0.4.24",
    "jieba>=0.42.1",
    "markdown>=3.5.1",
    "pyyaml>=6.0.1",
    "jinja2>=3.1.3",
    "structlog>=24.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
