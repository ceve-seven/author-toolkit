# src/config/ai_trace_thresholds.yaml
# 作用：定义 AI 痕迹检测的各项阈值配置
# 读取者：AITraceDetector.detect()
# 读取时机：AI 痕迹检测时
# 说明：阈值单位与代码检测逻辑一致，可根据实际效果微调

ai_trace_thresholds:
  detection:
    uniform_sentence_structure:
      enabled: true
      threshold: 0.55
      description: "均匀句式检测——计算句式波动系数（std/mean），低于阈值时标记为句式匀质化"
    transition_word_overuse:
      enabled: true
      threshold: 6.0
      description: "过渡词过频检测——统计过渡词密度（次/千字），超过阈值时标记为过渡词依赖"
    emotion_telling:
      enabled: true
      threshold: 2
      description: "情感告知化检测——检测情感标签（感到/觉得/心中充满等）出现次数（原始计数），超过阈值时标记"
    functional_dialogue:
      enabled: true
      threshold: 0.60
      description: "对话功能化检测——信息密集型对话占比，超过阈值时标记"
    templated_description:
      enabled: true
      threshold: 1
      description: "描述模板化检测——匹配高频描写模板的命中数（原始计数），>= 阈值时标记"
    safety_bias:
      enabled: true
      threshold: 0
      description: "安全偏好检测——安全化表达出现次数（原始计数），> 阈值时标记"
    hook_strength:
      enabled: true
      threshold: 0.60
      description: "章末钩子强度检测——每章结尾300字分析，低于阈值标记为'章末无力'"
    rhythm_collapse:
      enabled: true
      threshold: 800
      description: "节奏塌陷检测——检测连续800字以上无信息揭露/情绪变化/悬念强化/场景切换的段落区间"
    direct_emotion_telling:
      enabled: true
      threshold: 0.10
      description: "直接情感告知检测——检测'他感到''她愤怒''心中充满'等直接情感标签，按次/千字计数，超过阈值标记"
    pov_violation:
      enabled: true
      threshold: 1
      description: "POV越界检测——检测当前场景POV角色是否描述了其他角色的心理活动，> 阈值时标记"
    negation_pattern:
      enabled: true
      threshold: 1
      description: "否定对比句检测——检测'不是A，是B'句式在同200字内出现的次数，超过阈值时标记"
    simile_overuse:
      enabled: true
      threshold: 2
      description: "比喻堆叠检测——检测'像/仿佛……一样'比喻句式在同500字内出现的次数，超过阈值时标记"
    sentence_start_repetition:
      enabled: true
      threshold: 0.15
      description: "同句式开头检测——以'他/她/它/这/那'开头的句子占比，超过阈值时标记"
    negative_parallelism:
      enabled: true
      threshold: 2
      description: "排比否定堆叠检测——检测连续以'不是'开头的句子数，>= 阈值时标记"
    discourse_marker_overuse:
      enabled: true
      threshold: 3.0
      description: "结构性过渡词检测——检测'首先/其次/最后/值得注意的是/综上所述'等论述式标记，按次/千字计数，超过阈值时标记"
    hedge_language:
      enabled: true
      threshold: 3.0
      description: "模糊化表达检测——检测'似乎/或许/不禁/某种/仿佛'等模糊词汇，按次/千字计数，超过阈值时标记"
    action_beat_repetition:
      enabled: true
      threshold: 3
      description: "动作模板检测——检测'微微一笑/点了点头/陷入沉思/深吸一口气'等套路动作描写（原始计数），>= 阈值时标记"
    reaction_template:
      enabled: true
      threshold: 2
      description: "情感反应模板检测——检测'心头一紧/一股暖流/眼中闪过/鼻头一酸'等公式化反应描写（原始计数），>= 阈值时标记"
    punctuation_ai_pattern:
      enabled: true
      threshold: 2.0
      description: "标点AI模式检测——检测破折号'——'过频/省略号'……'过频/叠用标点'！！？？'等AI标点特征，按加权综合密度（次/千字）计算，低于阈值不标记"

  fix_strategy:
    level1_auto_fix:
      - uniform_sentence_structure
      - transition_word_overuse
      - templated_description
      - direct_emotion_telling
      - simile_overuse
    level2_semi_auto:
      - emotion_telling
      - functional_dialogue
      - hook_strength
      - rhythm_collapse
      - negation_pattern
      - sentence_start_repetition
      - negative_parallelism
      - discourse_marker_overuse
      - hedge_language
      - action_beat_repetition
      - reaction_template
      - punctuation_ai_pattern
    level3_report_only:
      - safety_bias
      - pov_violation
